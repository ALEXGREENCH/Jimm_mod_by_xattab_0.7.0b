name: Recovery build and bytecode audit
on: [push, pull_request, workflow_dispatch]
jobs:
  maintained-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/test_source.py --matrix
      - run: python tools/audit_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: maintained-src-may-reconstruction
          path: |
            dist/source/
            preservation/reports/source-tests.json
            preservation/reports/source-bytecode-comparison.json
            preservation/reports/source-light.json
            preservation/reports/source-light-bytecode.json
            preservation/reports/source-language-loader.json
            preservation/reports/source-packets.json
            preservation/reports/source-server-actions.json
            preservation/reports/source-runnable.json
            preservation/reports/source-xtraz.json
            preservation/reports/source-convertor.json
            preservation/reports/source-birthday.json
            preservation/reports/source-socket.json
            preservation/reports/source-socket-bytecode.json
            preservation/reports/source-request-info.json
            preservation/reports/source-request-info-categories.json
            preservation/reports/source-xstatus-catalog.json
            preservation/reports/source-xstatus-bytecode.json
            preservation/reports/source-password.json
            preservation/reports/source-phone-book.json
            preservation/reports/source-phone-book-bytecode.json
            preservation/reports/source-save-info.json
            preservation/reports/source-save-info-locales.json
            preservation/reports/source-magic-eye.json
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/recover.py all
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-midp2-ru-reconstruction
          path: |
            dist/reconstructed/
            preservation/reports/midp2-bytecode-comparison.json
            preservation/reports/differential-tests.txt
